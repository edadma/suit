# suit documentation site — built with juicer, juicerdocs theme.
#
# Local preview:  cd /Users/ed/dev/juicer && sbt 'juicerJVM/run serve -s /Users/ed/dev/suit/docs -L'
# Build:          cd /Users/ed/dev/juicer && sbt 'juicerJVM/run build --source /Users/ed/dev/suit/docs'

title       = "suit"
author      = "Ed Maxedon"
baseURL     = "https://suit.edadma.dev/"
description = "A declarative, reactive UI toolkit for Scala Native — Flutter-style constraint layout rendered through SDL3, built on the vdom core."

# Drives the topbar GitHub icon and the homepage hero "Star on GitHub" button.
repoURL = "https://github.com/edadma/suit"

theme = "juicerdocs"

# The page <h1> comes from frontmatter title — markdown headings start at h2.
headingShift = 0

# Static hosts serve the on-disk layout literally, so the URL space must match
# the file tree. Force htmlDir off so URLs and paths agree on deploy.
htmlDir = ""

# Recompile the theme CSS from SCSS and bundle/minify the theme JS on every build
# (fingerprinted for cache-busting). Degrades to a verbatim copy when sass/esbuild
# aren't on PATH, so the page still renders.
[assets]
enabled     = true
fingerprint = true

[[assets.sass]]
input  = "themes/juicerdocs/src/scss/juicerdocs.scss"
output = "/juicerdocs.css"
minify = true

[[assets.esbuild]]
input  = "themes/juicerdocs/static/juicerdocs.js"
output = "/juicerdocs.js"
minify = true

[juicerdocs]
version    = "v0.0.11"
getStarted = true

# Violet palette (distinct from sdl3's amber and riposte's teal). Light mode.
brand           = "#7048e8"        # violet-7 — links, button fills, hero gradient start
brandStrong     = "#6741d9"        # violet-8 — hover state
brandSoft       = "#e5dbff"        # violet-1 — soft tint: sidebar hover, badges
accent          = "#9775fa"        # violet-5 — hero gradient end, decorative highlights

# Dark-mode overrides (lighter, as dark surfaces need more luminance).
brandDark       = "#b197fc"        # violet-3
brandStrongDark = "#d0bfff"        # violet-2
brandSoftDark   = "rgb(112 72 232 / .18)"
accentDark      = "#9775fa"        # violet-5
